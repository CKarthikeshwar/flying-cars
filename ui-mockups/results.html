<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirHop results mockup</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    min-height: 100vh; display: grid; place-items: center; padding: clamp(14px, 3vh, 48px) clamp(16px, 3vw, 48px);
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,122,26,0.14), transparent 70%),
      repeating-linear-gradient(90deg, rgba(34,48,58,0.3) 0 1px, transparent 1px 96px),
      var(--ground);
  }
  .sheet { width: min(1120px, 100%); display: grid; gap: clamp(14px, 2.6vh, 32px); }

  .top { display: grid; grid-template-columns: auto 1fr; gap: clamp(18px, 3vw, 48px); align-items: end; }
  .place { font: 800 clamp(90px, min(15vw, 24vh), 210px)/0.8 var(--font-num); color: var(--heat); }
  .place sup { font: 700 0.3em/1 var(--font-num); vertical-align: top; margin-left: 0.06em; letter-spacing: 0.04em; }
  .head h1 { margin: 0; font: 700 clamp(20px, 2.2vw, 28px)/1 var(--font-ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); }
  .head .track { margin: 8px 0 14px; font: 800 clamp(34px, 4.4vw, 60px)/0.95 var(--font-num); letter-spacing: 0.06em; text-transform: uppercase; }
  .total { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; }
  .total b { font: 700 clamp(46px, 6vw, 84px)/0.95 var(--font-num); }
  .total span { color: var(--alarm); font: 600 20px var(--font-num); letter-spacing: 0.04em; }

  .record {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; padding: 8px 18px 8px 14px;
    background: var(--charge); color: #0d1700; font: 800 20px/1 var(--font-num); letter-spacing: 0.14em; text-transform: uppercase;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }

  .grid { display: grid; grid-template-columns: 5fr 6fr; gap: clamp(16px, 2vw, 28px); }
  .box { background: rgba(12,17,22,0.9); padding: clamp(16px, 2vw, 26px);
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px)); }
  h2 { margin: 0 0 14px; font: 600 14px var(--font-ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 500 12px var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); padding: 0 0 8px; }
  th:last-child, td:last-child { text-align: right; }
  td { padding: 11px 0; border-top: 1px solid var(--line); font: 600 24px/1 var(--font-num); letter-spacing: 0.02em; }
  td.lbl { font: 500 15px var(--font-ui); color: var(--text-dim); letter-spacing: 0; }
  .ahead { color: var(--charge); } .behind { color: var(--alarm); }
  tr.best td:first-child { color: var(--charge); }
  tr.you td { background: rgba(255,122,26,0.14); color: var(--text); }
  tr.you td:first-child { padding-left: 10px; } tr.you td:last-child { padding-right: 10px; }
  tr.you .lbl { color: var(--text); font-weight: 600; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; }
  .btn {
    appearance: none; border: 0; cursor: pointer; font: 800 24px/1 var(--font-num); letter-spacing: 0.14em; text-transform: uppercase;
    padding: 16px 32px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: background 120ms linear, transform 160ms var(--ease-out);
  }
  .btn:hover { transform: translateX(3px); }
  .btn.primary { background: var(--heat); color: #1a0c00; }
  .btn.primary:hover { background: #ff9340; }
  .btn.primary kbd { background: rgba(255,255,255,0.28); color: #1a0c00; }
  .btn.ghost { background: var(--panel-2); color: var(--text); }
  .btn.ghost:hover { background: var(--line); }
  kbd { font: 600 13px var(--font-num); padding: 2px 8px; margin-left: 10px; background: rgba(0,0,0,0.25); letter-spacing: 0.06em; }

  .enter { animation: up 700ms var(--ease-out) both; }
  .enter:nth-child(2) { animation-delay: 90ms; } .enter:nth-child(3) { animation-delay: 170ms; }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } }

  @media (max-width: 820px) { .top, .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="sheet">
  <section class="top enter">
    <div class="place" aria-label="Finished second">2<sup>ND</sup></div>
    <div class="head">
      <h1>Finished, 2nd of 4</h1>
      <p class="track">Spiral Tower</p>
      <div class="total"><b class="num">3:41.688</b><span class="num">includes +3.0 s crash penalty</span></div>
      <div class="record">New best lap 1:12.904</div>
    </div>
  </section>

  <div class="grid">
    <section class="box enter" aria-labelledby="laps">
      <h2 id="laps">Laps</h2>
      <table>
        <thead><tr><th scope="col">Lap</th><th scope="col">Time</th><th scope="col">vs ghost</th></tr></thead>
        <tbody>
          <tr><td class="lbl">1</td><td class="num">1:14.388</td><td class="num behind">+1.48</td></tr>
          <tr class="best"><td class="lbl">2</td><td class="num">1:12.904</td><td class="num ahead">new</td></tr>
          <tr><td class="lbl">3</td><td class="num">1:11.396</td><td class="num ahead">-1.51</td></tr>
        </tbody>
      </table>
    </section>

    <section class="box enter" aria-labelledby="st">
      <h2 id="st">Standings</h2>
      <table>
        <thead><tr><th scope="col">Racer</th><th scope="col">Total</th></tr></thead>
        <tbody>
          <tr><td class="lbl">1st&nbsp;&nbsp;Kestrel</td><td class="num">3:38.120</td></tr>
          <tr class="you"><td class="lbl">2nd&nbsp;&nbsp;You</td><td class="num">3:41.688</td></tr>
          <tr><td class="lbl">3rd&nbsp;&nbsp;Marrow</td><td class="num">3:49.552</td></tr>
          <tr><td class="lbl">4th&nbsp;&nbsp;Dune</td><td class="num">3:55.017</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <div class="actions enter">
    <button class="btn primary">Race again<kbd>Enter</kbd></button>
    <button class="btn ghost">Next track<kbd>N</kbd></button>
    <button class="btn ghost">Menu<kbd>Esc</kbd></button>
  </div>
</div>
</body>
</html>
